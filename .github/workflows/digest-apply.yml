name: Digest Apply

# Tick candidates in a research digest issue and this opens a pull request.
# The logic lives in ranjithrajv/awesome-enhancer.

on:
  issues:
    types: [edited]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  apply:
    if: contains(github.event.issue.labels.*.name, 'research') && github.event.issue.state == 'open'
    uses: ranjithrajv/awesome-enhancer/.github/workflows/digest-apply.yml@main
    with:
      issue-number: ${{ github.event.issue.number }}
    secrets: inherit
