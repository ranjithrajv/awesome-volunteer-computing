name: Digest Apply

# Tick candidates in a research digest issue and this opens a pull request.
# The logic lives in ranjithrajv/awesome-enhancer.

on:
  issues:
    types: [edited]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Digest issue number whose ticked candidates to apply
        required: true
        type: number

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  apply:
    uses: ranjithrajv/awesome-enhancer/.github/workflows/digest-apply.yml@main
    with:
      # inputs first: on a workflow_dispatch there is no github.event.issue,
      # and the left operand of || is evaluated before it can fall back.
      issue-number: ${{ inputs.issue_number || github.event.issue.number }}
    secrets: inherit
