name: Research Digest

# The engine lives in ranjithrajv/awesome-enhancer; this repository only owns
# .github/research-digest.json. See tools/research-digest/README.md there.

on:
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:
    inputs:
      days_back:
        description: Lookback window in days (0 = use the config value)
        default: '0'
      dry_run:
        description: Scan and summarise without opening an issue
        type: boolean
        default: true

permissions:
  contents: read
  issues: write
  models: read

jobs:
  digest:
    uses: ranjithrajv/awesome-enhancer/.github/workflows/research-digest.yml@main
    with:
      config-path: .github/research-digest.json
      days-back: ${{ fromJSON(github.event.inputs.days_back || '0') }}
      dry-run: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
    secrets: inherit
